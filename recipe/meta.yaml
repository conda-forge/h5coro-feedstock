{% set name = "h5coro" %}
{% set version = "1.0.7" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/h5coro-{{ version }}.tar.gz
  sha256: ebe78ed35da688fe7508da7f032f9b34a29b49eff61199655a43b94bc37b053c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - boto3
    - earthaccess >=0.5.0
    - requests
    - xarray

test:
  imports:
    - h5coro
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ICESat2-SlideRule/h5coro/
  summary: Python package for reading HDF5 data from S3
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jpswinski
    - elidwa
